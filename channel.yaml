title: I Killed Darnell Simmons
description: >-
  Deeply researched long-form history and legal analysis. Every episode is
  built from primary sources and independently fact-checked, and says plainly
  what the evidence establishes, what it only suggests, and what it cannot
  settle. The name is a Key and Peele reference, from a sketch about the
  difference between a story someone wrote and a thing someone did.
base_url: https://github.com/raymondeinhornfinkle/audio-feed
author: Raymond Einhorn Finkle
episodes:
- file: israel-palestine-episode-v2.mp3
  title: 'The Israel–Palestine Conflict: A Narrated History'
  description: A chronological, evidence-grounded history of the Israel–Palestine
    conflict, from Basel in 1897 to the present — competing national claims, imperial
    promises, wars, displacement, and the questions every settlement attempt has left
    unresolved.
  pubdate: 2026-08-29
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/israel-palestine-episode-v2.mp3
- file: the-making-of-england.mp3
  title: 'The Making of England: Vikings, Alfred, and the Kingdom That Almost Wasn''t'
  description: How a collection of competing Anglo-Saxon kingdoms, facing what at
    times looked like destruction by Viking armies, became the Kingdom of England.
    From the night attack on Chippenham in 878 through Alfred in the marshes, the
    burhs, the Danelaw, Edward and Aethelflaed, Aethelstan's capture of York in 927,
    Brunanburh, and the final securing of the north in 954. The real history behind
    Bernard Cornwell's The Last Kingdom.
  pubdate: '2026-08-30'
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/the-making-of-england.mp3
- file: before-basel-part-1.mp3
  title: 'Before Basel, Part One: The Land, the Kingdoms, and the Roman Rupture'
  description: Part one of a prequel to The Israel-Palestine Conflict. From the geography
    that made this corridor matter, through the first villages and the Bronze Age
    city-states, the emergence of Israel and Judah, Assyrian and Babylonian deportation,
    Persian Yehud, the Hellenistic and Hasmonean centuries, Herod's Jerusalem, and
    the revolt that ended the Second Temple. What the evidence establishes, what it
    suggests, and what it cannot settle.
  pubdate: '2026-08-31'
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/before-basel-part-1.mp3
- file: before-basel-part-2.mp3
  title: 'Before Basel, Part Two: Christian Empire, Islamic Rule, and the Crusader
    Centuries'
  description: Part two of a prequel to The Israel-Palestine Conflict. From Bar Kokhba
    and the limits of return, through the Christianization of the empire and the plural
    landscape it never erased, the Arab conquest and the question of what actually
    happened to the people already there, Umayyad Jerusalem, the Abbasid and Fatimid
    centuries, Crusader rule, Ayyubid recovery, and the Mamluk pilgrimage roads.
  pubdate: '2026-08-31'
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/before-basel-part-2.mp3
- file: before-basel-part-3.mp3
  title: 'Before Basel, Part Three: Ottoman Centuries and the Approach to 1900'
  description: Part three of a prequel to The Israel-Palestine Conflict. From the
    Ottoman conquest and the provincial frame, through waqf and the courts, the 1858
    Land Code and what it actually did, the ecology of survival, the problem of counting
    a population nobody counted the same way, nineteenth-century migration and reform,
    and the national movements taking shape at the century's end. Closes by asking
    what this history can and cannot decide about the modern claims.
  pubdate: '2026-08-31'
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/before-basel-part-3.mp3
- file: clancy-verdict-question.mp3
  title: 'The Clancy Verdict Question: What the Jury Must Decide'
  description: 'A pre-verdict legal analysis of Commonwealth v. Lindsay Clancy, recorded
    on September first, two thousand twenty-six, while the jury was still deliberating.
    Reconstructs the public evidentiary record, applies the Massachusetts criminal-responsibility
    standard and the law of homicide grading, weighs the competing expert testimony,
    and forecasts each possible verdict with reasoned probabilities. Analysis only:
    no advocacy, and no claim that a verdict has been returned. Research note: Associated
    Press and Massachusetts state materials could not be retrieved during research,
    so the record here rests on court transcripts, case law, and mainstream reporting,
    and the underlying research disposition is provisional.'
  pubdate: '2026-09-01'
  url: https://raymondeinhornfinkle.github.io/audio-feed/episodes/clancy-verdict-question.mp3
